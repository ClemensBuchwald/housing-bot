[project]
name = "housing-bot"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
# Nur nötig, wenn eine echte JS-Quelle aktiviert wird (siehe docs/sources.md)
browser = [
    "playwright>=1.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
